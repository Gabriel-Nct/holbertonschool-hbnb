<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Review</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='icon.png') }}">
</head>
<body>
    <header>
        <nav>
            <a href="index"><img src="{{ url_for('static', filename='Image_2-removebg-preview.png') }}"  alt="Places Logo" class="logo"></a>
            <div class="nav-links">
                <a href="index" class="nav-button">Home</a>
                <a href="login" class="login-button">Login</a>
            </div>
        </nav>
    </header>

    <main>
        <form id="review-form" class="add-review" data-place-id="1">
            <h2>Add a Review</h2>
            <div class="place-info">
                <h3>Urban studio</h3>
                <p>$150/night</p>
            </div>

            <div class="form-group">
                <label>Rating:</label>
                <div class="rating-input">
                    <input type="radio" id="star5" name="rating" value="5" required>
                    <label for="star5" title="5 stars">★</label>
                    <input type="radio" id="star4" name="rating" value="4">
                    <label for="star4" title="4 stars">★</label>
                    <input type="radio" id="star3" name="rating" value="3">
                    <label for="star3" title="3 stars">★</label>
                    <input type="radio" id="star2" name="rating" value="2">
                    <label for="star2" title="2 stars">★</label>
                    <input type="radio" id="star1" name="rating" value="1">
                    <label for="star1" title="1 star">★</label>
                </div>
            </div>

            <div class="form-group">
                <label for="review">Your Review:</label>
                <textarea id="review" name="comment" rows="5" required placeholder="Share your experience..."></textarea>
            </div>

            <div class="form-actions">
                <a href="place" class="cancel-button">Cancel</a>
                <button type="submit">Submit Review</button>
            </div>
        </form>
    </main>

    <footer>
        <p>© 2025 Places. All rights reserved.</p>
    </footer>

    <script src="{{ url_for('static', filename='scripts.js') }}"></script>  
</body>
</html>
